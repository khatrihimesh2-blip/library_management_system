<svg xmlns="http://www.w3.org/2000/svg" width="500" height="340" viewBox="0 0 500 340" font-family="Helvetica, Arial, sans-serif">
  <style>
    .box{fill:#fdecec;stroke:#b5302d;stroke-width:1.5;}
    .stdbox{fill:#eceff3;stroke:#55606e;stroke-width:1.5;}
    .title{fill:#8a201e;font-size:13px;font-weight:bold;}
    .stdtitle{fill:#333;font-size:13px;font-weight:bold;}
    .arrow{stroke:#b5302d;stroke-width:1.5;fill:none;}
    .lbl{fill:#6b7684;font-size:10px;font-style:italic;}
  </style>
  <defs>
    <marker id="trie" markerWidth="14" markerHeight="14" refX="12" refY="6" orient="auto">
      <path d="M1,1 L13,6 L1,11 Z" fill="#fff" stroke="#b5302d" stroke-width="1.2"/>
    </marker>
  </defs>

  <rect class="stdbox" x="165" y="10" width="170" height="34" rx="3"/>
  <text class="stdtitle" x="250" y="32" text-anchor="middle">std::exception</text>

  <path class="arrow" d="M250,96 L250,44" marker-end="url(#trie)"/>
  <rect class="stdbox" x="160" y="96" width="180" height="34" rx="3"/>
  <text class="stdtitle" x="250" y="118" text-anchor="middle">std::runtime_error</text>

  <path class="arrow" d="M250,182 L250,130" marker-end="url(#trie)"/>
  <rect class="box" x="175" y="182" width="150" height="34" rx="3"/>
  <text class="title" x="250" y="204" text-anchor="middle">BankException</text>

  <path class="arrow" d="M140,282 L220,216" marker-end="url(#trie)"/>
  <path class="arrow" d="M360,282 L280,216" marker-end="url(#trie)"/>

  <rect class="box" x="30" y="282" width="190" height="42" rx="3"/>
  <text class="title" x="125" y="300" text-anchor="middle">InvalidAmount</text>
  <text class="lbl" x="125" y="316" text-anchor="middle">thrown when amount ≤ 0</text>

  <rect class="box" x="280" y="282" width="190" height="42" rx="3"/>
  <text class="title" x="375" y="300" text-anchor="middle">InsufficientFunds</text>
  <text class="lbl" x="375" y="316" text-anchor="middle">thrown when amount &gt; balance</text>
</svg>
