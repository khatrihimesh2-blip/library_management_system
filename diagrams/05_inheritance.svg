<svg xmlns="http://www.w3.org/2000/svg" width="420" height="440" viewBox="0 0 420 440" font-family="Helvetica, Arial, sans-serif">
  <style>
    .box{fill:#eef4fb;stroke:#2c5a8c;stroke-width:1.5;}
    .title{fill:#1b3a5c;font-size:14px;font-weight:bold;}
    .mem{fill:#333;font-size:11px;}
    .line{stroke:#2c5a8c;stroke-width:1;}
    .arrow{stroke:#2c5a8c;stroke-width:1.5;fill:none;}
    .lbl{fill:#6b7684;font-size:10px;font-style:italic;}
  </style>
  <defs>
    <marker id="tri" markerWidth="14" markerHeight="14" refX="12" refY="6" orient="auto">
      <path d="M1,1 L13,6 L1,11 Z" fill="#fff" stroke="#2c5a8c" stroke-width="1.2"/>
    </marker>
  </defs>

  <!-- Person -->
  <rect class="box" x="130" y="10" width="160" height="60" rx="3"/>
  <text class="title" x="210" y="28" text-anchor="middle">Person</text>
  <line class="line" x1="130" y1="36" x2="290" y2="36"/>
  <text class="mem" x="138" y="51"># name_ : string</text>
  <text class="mem" x="138" y="65"># age_ : int</text>

  <!-- arrow Student -> Person -->
  <path class="arrow" d="M210,150 L210,72" marker-end="url(#tri)"/>
  <text class="lbl" x="218" y="115">single inheritance</text>

  <!-- Student -->
  <rect class="box" x="120" y="150" width="180" height="74" rx="3"/>
  <text class="title" x="210" y="168" text-anchor="middle">Student : Person</text>
  <line class="line" x1="120" y1="176" x2="300" y2="176"/>
  <text class="mem" x="128" y="191"># studentId_ : string</text>
  <text class="mem" x="128" y="205"># course_ : string</text>
  <text class="mem" x="128" y="219">+ displayStudent()</text>

  <!-- arrow Graduate -> Student -->
  <path class="arrow" d="M210,318 L210,226" marker-end="url(#tri)"/>
  <text class="lbl" x="218" y="276">multilevel</text>

  <!-- GraduateStudent -->
  <rect class="box" x="95" y="318" width="230" height="88" rx="3"/>
  <text class="title" x="210" y="336" text-anchor="middle">GraduateStudent : Student</text>
  <line class="line" x1="95" y1="344" x2="325" y2="344"/>
  <text class="mem" x="103" y="359">- researchTopic_ : string</text>
  <text class="mem" x="103" y="373">- supervisor_ : string</text>
  <text class="mem" x="103" y="387">+ displayGraduate()</text>
  <text class="mem" x="103" y="401">(inherits all Person + Student members)</text>
</svg>
